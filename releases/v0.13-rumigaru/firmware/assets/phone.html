<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ポケットリンク</title>
<style>
:root{color-scheme:light;--ink:#203d40;--teal:#167d76;--paper:#f5f4e9}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px system-ui,sans-serif}header,main,nav{max-width:850px;margin:auto;padding:20px}header{display:flex;align-items:center;justify-content:space-between;gap:10px}h1{font-size:25px;margin:0}h2{font-size:22px}small{color:#59716b}button{border:0;background:var(--teal);color:white;border-radius:12px;padding:12px 15px;font:inherit;cursor:pointer}button:disabled{opacity:.5}nav{display:flex;gap:8px;overflow:auto;padding-top:0}nav button{white-space:nowrap;background:#e2e8de;color:var(--ink)}nav .active{background:var(--teal);color:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:15px}.card{background:white;border:1px solid #dce2d4;border-radius:20px;padding:18px}.hero{display:grid;grid-template-columns:1fr 1fr;gap:20px}.portrait{background:#eaf0db;border-radius:18px;text-align:center}canvas{width:100%;max-width:256px;image-rendering:pixelated;aspect-ratio:1}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#eef3e9;padding:10px;border-radius:10px}progress{width:100%;height:12px;accent-color:var(--teal)}.muted{font-size:14px;color:#61766d}.bar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.tag{font-size:13px;background:#eaf0e5;padding:5px 8px;border-radius:7px}footer{max-width:850px;margin:auto;padding:20px;font-size:13px;color:#61766d}@media(max-width:500px){header,main,nav{padding:14px}.hero{grid-template-columns:1fr}h1{font-size:21px}}
input,select{font:inherit;width:100%;padding:10px;border:1px solid #b9cbc3;border-radius:10px;background:white;color:var(--ink)}.field{display:grid;gap:6px;margin:12px 0}.part-preview{display:block;margin:16px auto;background:repeating-conic-gradient(#e2e8de 0% 25%,#f7f8f3 0% 50%) 0/16px 16px}.bar{align-items:center}</style><header><div><small>RADIO ROAM</small><h1>ポケットリンク</h1></div><button id="sync">同期する</button></header><nav id="nav"></nav><main><p id="status">端末を読み込んでいます…</p><section id="view"></section></main><footer>端末の「スマホ」画面を開き、表示されたWi-Fiに接続してください。育成操作とパーツ追加ができます。接続中はインターネット不要です。<div class="bar"><button id="download">データを保存</button><button id="offline">オフライン用ページを保存</button></div>Wi-Fiを切ったあとも、開いているページと保存したページで閲覧できます。</footer>
<script src="/phone_controls.js"></script><script>
function readSaved(k,f){try{return JSON.parse(localStorage.getItem(k))||f}catch{return f}}
let state=window.ROAM_SAVED_STATE||readSaved('roam-state',null);let sprites=window.ROAM_SAVED_SPRITES||readSaved('roam-sprites',{});let tab='partner';
const $=id=>document.getElementById(id),types=['ケモノ','トリ','リュウ','サカナ','ヒト','ショクブツ'];
function el(tag,text,cls){let n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
function paletteLabel(p){return p.palette_name||String(p.palette)}
async function portrait(p){let c=el('canvas');c.width=c.height=64;let key=p.uid+':'+p.gene_id+':'+p.evolution+':'+(state.art_revision||0);let draw=sp=>{let im=c.getContext('2d').createImageData(64,64);for(let i=0;i<4096;i++){let n=parseInt(sp.pixels.slice(i*2,i*2+2),16);let rgb=sp.palette[n]||[0,0,0];im.data.set([...rgb,n?255:0],i*4)}c.getContext('2d').putImageData(im,0,0)};if(sprites[key])draw(sprites[key]);else if(!window.ROAM_SAVED_STATE){try{let r=await fetch('/api/sprite?id='+encodeURIComponent(p.uid)+'&stage='+p.evolution,{signal:AbortSignal.timeout(12000)});if(r.ok){sprites[key]=await r.json();draw(sprites[key]);try{localStorage.setItem('roam-sprites',JSON.stringify(sprites))}catch{}}}catch{}}return c}
function stat(label,value){let d=el('div',undefined,'stat');d.append(el('small',label),el('div',String(value)));return d}
async function card(p,detail=false){let d=el('article',undefined,'card');let ph=el('div',undefined,'portrait');ph.append(await portrait(p));d.append(ph,el('h2',(p.display_name||p.species_name||p.subtype||types[p.type])+' · Lv.'+p.level),el('p',(p.evolution_name||['幼体','中間体','成体'][p.evolution])+' / 第'+p.generation+'世代 / カラー'+paletteLabel(p),'muted'));let st=el('div',undefined,'stats');st.append(stat('HP',p.hp+'/'+(p.stats?.hp||30+p.level*6)),stat('経験値',p.xp+'/'+p.level*12));if(detail){for(let [k,l]of[['attack','攻撃'],['defense','防御'],['special','特殊'],['speed','素早さ']])st.append(stat(l,p.stats?.[k]??'—'));}d.append(st);if(detail){d.append(el('p','特性 '+(p.trait_name||'—')+' / マスタリー '+(p.mastery||0),'muted'));for(let[k,l]of[['fullness','おなか'],['mood','機嫌'],['energy','元気']]){d.append(el('p',l+' '+p[k]));let b=el('progress');b.max=100;b.value=p[k];d.append(b)}let bar=el('div',undefined,'bar');(p.moves||[]).forEach((m,i)=>bar.append(el('span',m+(p.level+p.evolution*5<[1,5,10,15][i]?' 🔒':''),'tag')));d.append(bar,el('p','パーツID: '+p.parts.join(' / '),'muted'),el('p','個体ID: '+p.uid,'muted'));}return d}
async function render(){let expected=tab;let host=$('view');let view=el('div');host.replaceChildren(view);if(!state){view.append(el('p','まだ同期データがありません。'));return}if(tab==='parts'){if(window.ROAM_SAVED_STATE)view.append(el('p','パーツ追加は端末への接続が必要です。'));else await renderParts(view);}else if(tab==='partner'){if(state.pet){view.append(await card(state.pet,true));if(!window.ROAM_SAVED_STATE){view.append(careControls(state.pet));view.append(renameControls(state.pet));}}else view.append(el('p','新しい卵が孵るのを待っています。'));for(let e of state.eggs||[]){if(window.ROAM_SAVED_STATE)view.append(el('div','🥚 孵化まで '+e.remaining+'秒','card'));else view.append(eggControls(e));}}else if(tab==='roster'||tab==='dex'){let pets=tab==='dex'?state.dex:[...(state.pet?[state.pet]:[]),...state.caught];view.append(el('h2',(tab==='dex'?'発見した姿':'所持している仲間')+' '+pets.length));let grid=el('div',undefined,'grid');view.append(grid);for(let p of pets){if(expected!==currentTab())break;let entry=await card(p,true);if(tab==='roster'&&!window.ROAM_SAVED_STATE)entry.append(selectionControl(p));grid.append(entry);}}else{view.append(el('h2','合成の系譜'));for(let f of [...state.family].reverse())view.append(el('div','第'+f.generation+'世代 '+f.child+' ← '+f.parents.join(' ＋ '),'card'));if(!state.family.length)view.append(el('p','合成すると親子の記録がここに残ります。'));view.append(el('h2','探索と持ち物'));view.append(el('p','発見 '+state.discoveries+' / 勝利 '+state.wins+' / すれ違い '+state.peers));let names={food:'ごはん',potion:'回復薬',scanner:'スキャナ',incubator:'孵化装置'};for(let[k,v]of Object.entries(state.inventory))view.append(el('p',names[k]+' × '+v));}}
function currentTab(){return tab}$('nav').replaceChildren();for(let[id,label]of[['partner','パートナー'],['roster','なかま'],['dex','図鑑'],['family','系譜'],['parts','パーツ工房']]){let b=el('button',label);b.onclick=()=>{tab=id;document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()};if(id===tab)b.classList.add('active');$('nav').append(b)}
async function sync(){let b=$('sync');b.disabled=true;try{let r=await fetch('/api/state',{signal:AbortSignal.timeout(20000)});if(!r.ok)throw Error();state=await r.json();sessionToken=(await api('/api/session')).token;online=true;try{localStorage.setItem('roam-state',JSON.stringify(state))}catch{}$('status').textContent='同期しました · '+new Date().toLocaleTimeString();await render()}catch{online=false;sessionToken=null;$('status').textContent=state?'保存済みデータを表示しています。':'端末のWi-Fiへ接続して同期してください。';await render()}finally{b.disabled=false}}
function download(name,body,type){let url=URL.createObjectURL(new Blob([body],{type}));let a=el('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('sync').onclick=sync;$('download').onclick=()=>state&&download('radio-roam.json',JSON.stringify(state,null,2),'application/json');
$('offline').onclick=async()=>{if(!state)return;let button=$('offline');button.disabled=true;for(let p of [...(state.pet?[state.pet]:[]),...state.caught,...state.dex])await portrait(p);let prefix='<script>window.ROAM_SAVED_STATE='+JSON.stringify(state).replaceAll('<','\\u003c')+';window.ROAM_SAVED_SPRITES='+JSON.stringify(sprites).replaceAll('<','\\u003c')+';<'+ '/script>';let html='<!doctype html>'+document.documentElement.outerHTML;html=html.replace('<script>',prefix+'<script>');download('radio-roam-offline.html',html,'text/html');button.disabled=false};
if(window.ROAM_SAVED_STATE){$('status').textContent='保存したオフラインデータ';render()}else sync();
</script></html>
